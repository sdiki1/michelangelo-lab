[project]
name = "michelangelo-bots"
version = "0.1.0"
description = "Telegram and MAX bots for Michelangelo butterfly kits"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "greenlet>=3.1,<4.0",
    "httpx>=0.27,<1.0",
    "openpyxl>=3.1,<4.0",
    "pydantic-settings>=2.5,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "requests>=2.32,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "respx>=0.21,<1.0",
    "ruff>=0.7,<1.0",
]

[project.scripts]
michelangelo-telegram-bot = "michelangelo_bots.telegram_bot:main"
michelangelo-max-bot = "michelangelo_bots.max_bot:main"
michelangelo-admin = "michelangelo_bots.admin:main"
michelangelo-readyscript-sync = "michelangelo_bots.readyscript_sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/michelangelo_bots/content.py" = ["E501"]
"src/michelangelo_bots/admin.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
