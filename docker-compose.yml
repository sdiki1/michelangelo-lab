services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: michelangelo
      POSTGRES_USER: michelangelo
      POSTGRES_PASSWORD: michelangelo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U michelangelo -d michelangelo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  telegram-bot:
    build: .
    env_file:
      - path: .env
        required: false
    command: michelangelo-telegram-bot
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  max-bot:
    build: .
    env_file:
      - path: .env
        required: false
    command: michelangelo-max-bot
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build: .
    env_file:
      - path: .env
        required: false
    command: michelangelo-admin
    ports:
      - "8000:8000"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  readyscript-sync:
    build: .
    env_file:
      - path: .env
        required: false
    command: michelangelo-readyscript-sync --loop --interval 60
    volumes:
      - ./readyscript-orders:/app/readyscript-orders:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  uploads-data:
